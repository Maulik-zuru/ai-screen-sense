services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ai_screen_sense
    ports:
      - "5432:5432"
    volumes:
      - ai-screen-sense-pg:/var/lib/postgresql/data

volumes:
  ai-screen-sense-pg:
